<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-page">

        <div class="login-brand">
            <div class="brand-logo"></div>
            <span class="brand-tag">School Management System</span>
            <h1>Shaheen Secondary School</h1>
            <p>Manage students, teachers, attendance, fees and results — all from one simple dashboard.</p>
        </div>

        <div class="login-form-wrap">
            <div class="login">
                <h2>Welcome Back</h2>
                <p class="login-sub">Login to your account to continue</p>

                <form id="loginForm">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit">Login</button>
                </form>
            </div>
        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
